name: Android bug report
description: Report a problem in the Majora ReMasked Android preview.
title: "[Android] "
body:
  - type: input
    id: version
    attributes:
      label: App version, device, and Android version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and expected behavior
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Adult Link, texture pack, and relevant settings
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Do not attach ROMs, imported models, voices, private keys, or personal saves.
