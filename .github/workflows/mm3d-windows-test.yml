name: DekUI Fork Windows
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Desktop CPU architecture
        type: choice
        options: [all, x64, arm64]
        default: all
concurrency:
  group: mm3d-windows-${{ github.ref }}-${{ inputs.architecture }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    if: inputs.architecture != 'arm64'
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 1
      - name: Read release version
        id: release
        shell: bash
        run: |
          release_version=$(python tools/mm3d/release_version.py)
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
      - name: Verify build revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='%H %s' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-ccache
      - uses: actions/cache/restore@v5
        with:
          path: .ccache-windows
          key: windows-ucrt-ccache-v2-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            windows-ucrt-ccache-v2-
            windows-ucrt-ccache-v1-
      - name: Configure, build, test and package
        run: |
          set -o pipefail
          bash tools/mm3d/windows/build-ci.sh 2>&1 | tee windows-build.log
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .ccache-windows
          key: windows-ucrt-ccache-v2-${{ github.sha }}-${{ github.run_id }}
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DekUI-Fork-Windows-Diagnostics-${{ github.sha }}
          path: |
            windows-build.log
            build-windows/CMakeFiles/CMakeConfigureLog.yaml
            build-windows/Testing/Temporary/LastTest.log
            build-windows/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
      - name: Check package privacy
        run: python tools/mm3d/check_release_privacy.py artifacts/DekUI-Fork-${{ steps.release.outputs.version }}-Windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: DekUI-Fork-${{ steps.release.outputs.version }}-Windows-x64-${{ github.sha }}
          path: artifacts/DekUI-Fork-${{ steps.release.outputs.version }}-Windows-x64.zip
          if-no-files-found: error
      - name: Archive matching source
        timeout-minutes: 15
        run: python tools/mm3d/package_source.py artifacts/DekUI-Fork-${{ steps.release.outputs.version }}-Source.tar.gz
      - name: Check package privacy
        run: python tools/mm3d/check_release_privacy.py artifacts/DekUI-Fork-${{ steps.release.outputs.version }}-Source.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: DekUI-Fork-${{ steps.release.outputs.version }}-Source-${{ github.sha }}
          path: artifacts/DekUI-Fork-${{ steps.release.outputs.version }}-Source.tar.gz
          if-no-files-found: error

  windows-arm64:
    if: inputs.architecture != 'x64'
    runs-on: windows-11-arm
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 1
      - name: Configure native ARM64 MSVC environment
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ARCH -ne 'ARM64') { throw 'Native ARM64 runner required' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -property installationPath
          if (!$installation) { throw 'Visual Studio not found' }
          $devcmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          $environment = & cmd /d /s /c "`"$devcmd`" -arch=arm64 -host_arch=arm64 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 compiler environment failed' }
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name, $value = $Matches[1], $Matches[2]
              if ($name -notmatch '^(GITHUB_|RUNNER_|NODE_OPTIONS$)' -and
                  [Environment]::GetEnvironmentVariable($name) -ne $value) {
                Set-Item "Env:$name" $value
                "$name=$value" >> $env:GITHUB_ENV
              }
            }
          }
          $compiler = (Get-Command cl).Source
          if ($compiler -notmatch 'Hostarm64\\arm64\\cl.exe$') { throw "Unexpected compiler: $compiler" }
          $compiler >> $env:GITHUB_STEP_SUMMARY
      - name: Verify revision
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Build revision mismatch' }
          git log -1 --format='%H %s' >> $env:GITHUB_STEP_SUMMARY
      - name: Build, test, check ARM64 payloads and package
        run: |
          python tools/mm3d/windows/build-arm64.py *> windows-arm64-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content windows-arm64-build.log -Tail 100; exit 1 }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DekUI-Fork-Windows-arm64-Diagnostics-${{ github.sha }}
          path: |
            windows-arm64-build.log
            build-windows-arm64/CMakeFiles/CMakeConfigureLog.yaml
            build-windows-arm64/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
      - name: Check package privacy
        run: python tools/mm3d/check_release_privacy.py artifacts/DekUI-Fork-*-Windows-arm64*
      - uses: actions/upload-artifact@v7
        with:
          name: DekUI-Fork-Windows-arm64-${{ github.sha }}
          path: artifacts/DekUI-Fork-*-Windows-arm64*
          if-no-files-found: error
