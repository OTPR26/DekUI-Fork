name: Mobile release checks
on:
  push:
    branches: [mobile-release-preparation]
    paths:
      - 'native/**'
      - '.github/workflows/mobile-release-checks.yml'
permissions:
  contents: read
concurrency:
  group: mobile-release-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios-data-folder:
    name: iOS data folder transaction checks
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and run synthetic folder-sync checks
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -fobjc-arc -Wno-deprecated-declarations \
            -framework Foundation \
            native/ports/remasked/runtime/ios/drive_data.mm \
            native/ports/remasked/tests/drive_data.mm \
            -o "$RUNNER_TEMP/drive-data-tests"
          "$RUNNER_TEMP/drive-data-tests"
      - name: Check the same implementation against the iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk iphoneos clang++ -std=c++20 -fobjc-arc \
            -target arm64-apple-ios16.0 -Wno-deprecated-declarations \
            -fsyntax-only native/ports/remasked/runtime/ios/drive_data.mm
      - name: Test public mobile package privacy gates
        run: python3 -m unittest discover -s native/ports/remasked/tests -p test_public_mobile.py -v
      - name: Verify public title input rejection
        run: python3 -m unittest discover -s native/ports/remasked/tests -p test_public_title_gate.py -v
      - name: Build and test native mobile settings and input core
        run: |
          cmake -S native/ports/remasked -B "$RUNNER_TEMP/mobile-core" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/mobile-core" --parallel 3
          ctest --test-dir "$RUNNER_TEMP/mobile-core" --output-on-failure
      - name: Check actual iOS launcher and Data-menu integration
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/sdl-headers"
          git -C "$RUNNER_TEMP/sdl-headers" fetch --depth 1 https://github.com/libsdl-org/SDL.git 98d1f3a45aae568ccd6ed5fec179330f47d4d356
          git -C "$RUNNER_TEMP/sdl-headers" checkout --detach FETCH_HEAD
          python3 native/ports/remasked/tools/check_ios_menu.py --core-build "$RUNNER_TEMP/mobile-core" --sdl "$RUNNER_TEMP/sdl-headers"
      - name: Compile the iOS ROM setup and HUD download code
        run: |
          xcrun --sdk iphoneos clang++ -std=c++20 -target arm64-apple-ios17.0 -fobjc-arc -fsyntax-only \
            native/ports/remasked/runtime/ios/hud_download.mm
      - name: Verify compiled path privacy
        run: python3 native/ports/remasked/tools/check_build_privacy.py --work "$RUNNER_TEMP"
  android-prepared-import:
    name: Android import and HUD source checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile against Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || sdkmanager "platforms;android-35"
          javac --release 17 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d "$RUNNER_TEMP" \
            native/ports/remasked/android-game/app/src/main/java/io/github/otpr26/remasked/nativegame/PreparedGameImport.java \
            native/ports/remasked/android-game/app/src/main/java/io/github/otpr26/remasked/nativegame/HudSetup.java
      - name: Compile the HUD setup library and test layout validation
        shell: bash
        run: |
          set -euo pipefail
          rustup run stable cargo build --locked --manifest-path native/tools/triaevum_forge/Cargo.toml -p remasked-hud
          rustup run stable cargo test --locked --manifest-path native/tools/triaevum_forge/Cargo.toml -p forge-assets --features title-mm3d mm3d_layout
