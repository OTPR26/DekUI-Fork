name: Mobile release checks
on:
  push:
    branches: [mobile-release-preparation]
    paths:
      - 'ports/remasked/runtime/ios/drive_data.*'
      - 'ports/remasked/tests/drive_data.mm'
      - 'ports/remasked/tools/audit_public_mobile.py'
      - 'ports/remasked/tests/test_public_mobile.py'
      - '.github/workflows/mobile-release-checks.yml'
permissions:
  contents: read
concurrency:
  group: mobile-release-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios-data-folder:
    name: iOS data folder transaction checks
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and run synthetic folder-sync checks
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -fobjc-arc -Wno-deprecated-declarations \
            -framework Foundation \
            ports/remasked/runtime/ios/drive_data.mm \
            ports/remasked/tests/drive_data.mm \
            -o "$RUNNER_TEMP/drive-data-tests"
          "$RUNNER_TEMP/drive-data-tests"
      - name: Check the same implementation against the iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk iphoneos clang++ -std=c++20 -fobjc-arc \
            -target arm64-apple-ios16.0 -Wno-deprecated-declarations \
            -fsyntax-only ports/remasked/runtime/ios/drive_data.mm
      - name: Test public mobile package privacy gates
        run: python3 -m unittest discover -s ports/remasked/tests -p test_public_mobile.py -v
