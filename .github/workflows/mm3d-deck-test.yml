name: DekUI Fork Linux
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Desktop CPU architecture
        type: choice
        options: [all, x64, arm64]
        default: all
concurrency:
  group: mm3d-deck-${{ github.ref }}-${{ inputs.architecture }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deck:
    if: inputs.architecture != 'arm64'
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      EXTRA_QT_PLUGINS: waylandcompositor
      EXTRA_PLATFORM_PLUGINS: libqwayland-egl.so;libqwayland-generic.so
    steps:
      - name: Free unused hosted-runner SDKs before pulling build image
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 1
      - name: Read release version
        id: release
        shell: bash
        run: |
          release_version=$(python3 tools/mm3d/release_version.py)
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
      - name: Verify build revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='%H %s' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: deck-ccache-v1-${{ github.sha }}-${{ github.run_id }}
          restore-keys: deck-ccache-v1-
      - name: Build, test and package in Linux toolchain container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache -e CCACHE_BASEDIR=/workspace \
            -e CCACHE_MAXSIZE -e CCACHE_COMPILERCHECK \
            -e EXTRA_QT_PLUGINS -e EXTRA_PLATFORM_PLUGINS \
            opensauce04/azahar-build-environment:latest \
            bash tools/mm3d/deck/build-ci.sh
          df -h /
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: .ccache
          key: deck-ccache-v1-${{ github.sha }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        with:
          name: DekUI-Fork-${{ steps.release.outputs.version }}-Linux-x86_64-${{ github.sha }}
          path: artifacts/DekUI-Fork-${{ steps.release.outputs.version }}-Linux-x86_64.tar.gz
          if-no-files-found: error
      - name: Archive matching source
        timeout-minutes: 15
        run: python3 tools/mm3d/package_source.py artifacts/DekUI-Fork-${{ steps.release.outputs.version }}-Source.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: DekUI-Fork-${{ steps.release.outputs.version }}-Source-${{ github.sha }}
          path: artifacts/DekUI-Fork-${{ steps.release.outputs.version }}-Source.tar.gz
          if-no-files-found: error

  linux-arm64:
    if: inputs.architecture != 'x64'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-linux-arm64
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      EXTRA_PLATFORM_PLUGINS: libqwayland-egl.so;libqwayland-generic.so
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 1
      - name: Verify architecture and revision
        run: |
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='%H %s' >> "$GITHUB_STEP_SUMMARY"
      - name: Install native ARM64 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang ccache pkg-config python3 \
            qt6-base-dev qt6-base-private-dev qt6-multimedia-dev qt6-tools-dev qt6-tools-dev-tools qt6-wayland \
            libsdl2-dev libasound2-dev libpulse-dev libudev-dev libusb-1.0-0-dev \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev \
            libxcb-cursor0 patchelf file libfuse2t64
      - uses: actions/cache@v5
        with:
          path: .ccache-linux-arm64
          key: linux-arm64-ccache-v1-${{ github.sha }}
          restore-keys: linux-arm64-ccache-v1-
      - name: Build, test, check ARM64 payload and package
        run: |
          set -o pipefail
          bash tools/mm3d/linux/build-arm64.sh 2>&1 | tee linux-arm64-build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DekUI-Fork-Linux-arm64-Diagnostics-${{ github.sha }}
          path: |
            linux-arm64-build.log
            build-linux-arm64/CMakeFiles/CMakeConfigureLog.yaml
            build-linux-arm64/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: DekUI-Fork-Linux-arm64-${{ github.sha }}
          path: artifacts/DekUI-Fork-*-Linux-arm64*
          if-no-files-found: error
