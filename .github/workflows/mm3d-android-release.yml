name: DekUI Fork Android
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit or tag to build (blank uses this workflow revision)
        required: false
        type: string
      package_existing_run:
        description: Optional successful run to repackage when application sources are unchanged
        required: false
        type: string
concurrency:
  group: android-release-${{ github.ref }}-${{ inputs.source_ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  android:
    if: inputs.package_existing_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CCACHE_DIR: ${{ github.workspace }}/.ccache-android
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: recursive
          fetch-depth: 1
      - name: Set build directories
        run: |
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-user" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Read source revision and version
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(python3 tools/mm3d/release_version.py)" >> "$GITHUB_OUTPUT"
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libgl1 libegl1 libxkbcommon0 libdbus-1-3
          python3 -m pip install aqtinstall==3.3.0
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;36.1.0' 'ndk;27.3.13750724' 'cmake;3.31.6'
      - uses: actions/cache@v5
        id: qt
        with:
          path: ${{ runner.temp }}/qt-android
          key: android-qt-6.12.0-linux-arm64-v1
      - name: Install Qt Android and host tools
        if: steps.qt.outputs.cache-hit != 'true'
        run: python3 -m aqt install-qt linux android 6.12.0 android_arm64_v8a --autodesktop --outputdir "$RUNNER_TEMP/qt-android"
      - name: Locate Qt kits
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])/'qt-android/6.12.0'
          android = root/'android_arm64_v8a'
          hosts = [p for p in root.iterdir() if p != android and (p/'lib/cmake/Qt6/Qt6Config.cmake').is_file()]
          if not (android/'lib/cmake/Qt6/Qt6Config.cmake').is_file() or len(hosts) != 1:
              raise SystemExit('Expected one matching Android kit and one host kit')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'DEKUI_ANDROID_QT_ROOT={android}\nDEKUI_HOST_QT_ROOT={hosts[0]}\n')
          PY
      - uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/gradle-user/caches
            ${{ runner.temp }}/gradle-user/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('src/android/**/*.gradle*', 'src/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-gradle-${{ runner.os }}-
      - uses: actions/cache@v5
        with:
          path: .ccache-android
          key: android-native-v1-${{ steps.source.outputs.sha }}
          restore-keys: android-native-v1-
      - name: Run setup and migration tests
        run: |
          python3 -m pip install numpy==2.2.6 pillow==11.0.0
          python3 -m unittest discover -s tools/mm3d -p 'test_*.py'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Build compressed-disc reader
        run: |
          bash tools/mm3d/build_android_disc_reader.sh
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('KEYSTORE_BASE64', '')
          if not value:
              raise SystemExit('Android signing secret is missing')
          root = Path(os.environ['ANDROID_USER_HOME'])
          root.mkdir(mode=0o700, parents=True, exist_ok=True)
          path = root/'debug.keystore'
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          PY
      - name: Build signed optimized APK
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > "$RUNNER_TEMP/dekui-ci.init.gradle" <<'GRADLE'
          allprojects {
              plugins.withId('com.android.application') {
                  extensions.getByName('androidComponents').finalizeDsl { android ->
                      def signing = android.signingConfigs.getByName('debug')
                      signing.storeFile = new File(System.getenv('ANDROID_USER_HOME'), 'debug.keystore')
                      signing.storePassword = System.getenv('ANDROID_KEYSTORE_PASS')
                      signing.keyAlias = System.getenv('ANDROID_KEY_ALIAS')
                      signing.keyPassword = System.getenv('ANDROID_KEYSTORE_PASS')
                      android.defaultConfig.externalNativeBuild.cmake.arguments.addAll([
                          '-DCMAKE_JOB_POOLS=ci_compile=2', '-DCMAKE_JOB_POOL_COMPILE=ci_compile',
                          '-DCMAKE_C_COMPILER_LAUNCHER=ccache', '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache'])
                  }
              }
          }
          GRADLE
          cd src/android
          ./gradlew :app:assembleVanillaPerformance \
            --init-script "$RUNNER_TEMP/dekui-ci.init.gradle" \
            -Pandroid.injected.build.abi=arm64-v8a -Pandroid.injected.testOnly=false \
            -PdekuiPresentation=true \
            "-PdekuiQtRoot=$DEKUI_ANDROID_QT_ROOT" "-PdekuiQtHost=$DEKUI_HOST_QT_ROOT" \
            --no-daemon --console=plain --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g
      - name: Verify and stage APK
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, shutil, subprocess, zipfile
          from pathlib import Path
          sdk = Path(os.environ['ANDROID_HOME'])/'build-tools/36.1.0'
          apks = list(Path('src/android/app/build').glob('intermediates/apk/vanilla/performance/*.apk'))
          if len(apks) != 1:
              raise SystemExit('Expected one optimized APK')
          apk = apks[0]
          with zipfile.ZipFile(apk) as archive:
              required = {"lib/arm64-v8a/libnod.so", "assets/chaquopy/app.imy"}
              if not required.issubset(archive.namelist()):
                  raise SystemExit("APK is missing Twilight Princess importer dependencies")
          cert = subprocess.check_output([str(sdk/'apksigner'), 'verify', '--print-certs', str(apk)], text=True)
          expected = '73e734704569a6f17f126bf09c243c24442f3e68c2ab20256b31cb44c6631615'
          if not re.search(r'Signer #1 certificate SHA-256 digest: '+expected, cert):
              raise SystemExit('APK signing identity does not match existing installations')
          badging = subprocess.check_output([str(sdk/'aapt'), 'dump', 'badging', str(apk)], text=True)
          if "name='io.github.otpr26.dekuifork'" not in badging.splitlines()[0]:
              raise SystemExit('APK application ID changed')
          if "versionName='"+os.environ['RELEASE_VERSION']+"'" not in badging.splitlines()[0]:
              raise SystemExit('APK version does not match the release')
          manifest = subprocess.check_output([str(sdk/'aapt'), 'dump', 'xmltree', str(apk), 'AndroidManifest.xml'], text=True)
          for flag in ('debuggable', 'testOnly'):
              if any('android:'+flag+'(' in line and '0xffffffff' in line for line in manifest.splitlines()):
                  raise SystemExit('APK must be optimized and installable outside development tools')
          out = Path('artifacts')/('DekUI-Fork-'+os.environ['RELEASE_VERSION']+'-Android-arm64.apk')
          out.parent.mkdir(exist_ok=True)
          shutil.copy2(apk, out)
          PY
          python3 tools/mm3d/check_release_privacy.py artifacts/*.apk
      - name: Remove signing key
        if: always()
        run: rm -f "$ANDROID_USER_HOME/debug.keystore" "$RUNNER_TEMP/dekui-ci.init.gradle"
      - uses: actions/upload-artifact@v7
        with:
          name: DekUI-Fork-${{ steps.source.outputs.version }}-Android-arm64-${{ steps.source.outputs.sha }}
          path: artifacts/*.apk
          if-no-files-found: error
      - name: Archive matching source
        run: python3 tools/mm3d/package_source.py artifacts/DekUI-Fork-${{ steps.source.outputs.version }}-Source.tar.gz
      - name: Check source privacy
        run: python3 tools/mm3d/check_release_privacy.py artifacts/*Source.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: DekUI-Fork-${{ steps.source.outputs.version }}-Android-Source-${{ steps.source.outputs.sha }}
          path: artifacts/*Source.tar.gz
          if-no-files-found: error

  package:
    if: inputs.package_existing_run != ''
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Fetch matching compiled APK
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RUN: ${{ inputs.package_existing_run }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          run = os.environ['BASE_RUN']
          if not re.fullmatch(r'[0-9]+', run):
              raise SystemExit('Invalid build run')
          repo = os.environ['GITHUB_REPOSITORY']
          info = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}']))
          if info['conclusion'] != 'success' or info['path'] != '.github/workflows/mm3d-android-release.yml':
              raise SystemExit('Expected a successful Android build')
          base = info['head_sha']
          subprocess.run(['git','diff','--exit-code',base,'HEAD','--','src',':!src/android/app/build.gradle.kts',
                          'externals','tools/mm3d/tp_import'],check=True)
          artifact = f'DekUI-Fork-0.2.2-Android-arm64-{base}'
          subprocess.run(['gh','run','download',run,'--repo',repo,'--name',artifact,'--dir','compiled'],check=True)
          PY
      - name: Build compressed-disc reader
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.1.0' 'ndk;27.3.13750724'
          bash tools/mm3d/build_android_disc_reader.sh
      - name: Package and sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, os, re, subprocess, zipfile
          from pathlib import Path
          sdk = Path(os.environ['ANDROID_HOME'])/'build-tools/36.1.0'
          base, = Path('compiled').glob('*.apk')
          expected = '73e734704569a6f17f126bf09c243c24442f3e68c2ab20256b31cb44c6631615'
          def verify(path):
              cert = subprocess.check_output([str(sdk/'apksigner'),'verify','--print-certs',str(path)],text=True)
              if 'Signer #1 certificate SHA-256 digest: '+expected not in cert:
                  raise SystemExit('Unexpected signing identity')
              badge = subprocess.check_output([str(sdk/'aapt'),'dump','badging',str(path)],text=True)
              if "name='io.github.otpr26.dekuifork'" not in badge.splitlines()[0]:
                  raise SystemExit('Unexpected application ID')
          verify(base)
          library = Path('src/android/app/build/dekuiJniLibs/arm64-v8a/libnod.so')
          reader = library.read_bytes()
          if reader[:6] != b'\x7fELF\x02\x01' or int.from_bytes(reader[18:20],'little') != 183:
              raise SystemExit('Expected ARM64 disc reader')
          member = 'lib/arm64-v8a/libnod.so'
          unsigned = Path(os.environ['RUNNER_TEMP'])/'unsigned.apk'
          def signature(name):
              return bool(re.fullmatch(r'META-INF/(?:MANIFEST\.MF|[^/]+\.(?:SF|RSA|DSA|EC))',name,re.I))
          with zipfile.ZipFile(base) as old, zipfile.ZipFile(unsigned,'w') as new:
              for entry in old.infolist():
                  if entry.filename == member or signature(entry.filename):
                      continue
                  new.writestr(entry,old.read(entry))
              new.writestr(member,reader,compress_type=zipfile.ZIP_DEFLATED)
          aligned = unsigned.with_name('aligned.apk')
          subprocess.run([str(sdk/'zipalign'),'-f','-p','4',str(unsigned),str(aligned)],check=True)
          key = Path(os.environ['RUNNER_TEMP'])/'signing.keystore'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'],validate=True))
          key.chmod(0o600)
          out = Path('artifacts/DekUI-Fork-0.2.2-Android-arm64.apk')
          out.parent.mkdir(exist_ok=True)
          try:
              subprocess.run([str(sdk/'apksigner'),'sign','--ks',str(key),'--ks-key-alias',os.environ['ANDROID_KEY_ALIAS'],
                              '--ks-pass','env:ANDROID_KEYSTORE_PASS','--key-pass','env:ANDROID_KEYSTORE_PASS',
                              '--out',str(out),str(aligned)],check=True)
          finally:
              key.unlink(missing_ok=True)
          verify(out)
          with zipfile.ZipFile(base) as old, zipfile.ZipFile(out) as new:
              for entry in old.infolist():
                  if entry.filename != member and not signature(entry.filename):
                      if new.read(entry.filename) != old.read(entry):
                          raise SystemExit('Repack changed an unrelated APK entry')
          with zipfile.ZipFile(out) as archive:
              if archive.read(member) != reader or 'assets/chaquopy/app.imy' not in archive.namelist():
                  raise SystemExit('Importer dependencies missing')
          PY
          python3 tools/mm3d/check_release_privacy.py artifacts/*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: DekUI-Fork-Android-TP-preview-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error
