name: Majora ReMasked iOS (unsigned)
on:
  push:
    branches: [ios-unsigned-release]
  workflow_dispatch:
    inputs:
      experimental_eur:
        description: Build the isolated European Rev 1 preview
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mm3d-ios-${{ github.ref }}-${{ inputs.experimental_eur }}
  cancel-in-progress: true
env:
  REMASKED_EXPERIMENTAL_EUR: ${{ inputs.experimental_eur && 'true' || 'false' }}
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify source and toolchain
        run: |
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          xcrun --sdk iphoneos --show-sdk-version
          command -v cmake
          command -v ninja
      - name: Build and audit unsigned package
        run: bash tools/mm3d/ios/build-ci.sh
      - name: Archive and audit source
        run: |
          python3 tools/mm3d/package_source.py artifacts/Majora-ReMasked-iOS-Source.tar.gz
          python3 tools/mm3d/check_release_privacy.py artifacts/Majora-ReMasked-iOS-Source.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: Majora-ReMasked-iOS-arm64-Unsigned-${{ github.sha }}
          path: |
            artifacts/Majora-ReMasked-*-iOS-arm64-Unsigned.ipa
            artifacts/Majora-ReMasked-iOS-Source.tar.gz
          if-no-files-found: error
